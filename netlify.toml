[build]
  publish = "/"

# Global headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Access-Control-Allow-Origin = "*"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    
# CSS files should be served with appropriate MIME type
[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=3600"

# Prevent redirect loops for static assets
[[redirects]]
  from = "/*.css"
  to = "/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.js"
  to = "/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.jpg"
  to = "/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.png"
  to = "/:splat"
  status = 200
  force = true

# HTML files should be served directly with no redirects
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 200
  force = true

# Default fallback - serve index.html but don't create redirect loop
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 